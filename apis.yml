name: Dialogue
description: 'Dialogue is a leading Canadian virtual healthcare and employee wellness
  provider operating an Integrated Health Platform that delivers primary care, mental
  health support, Employee Assistance Programs (EAP), and wellness programming to members
  through a single mobile and web application available 24/7/365. The company serves
  more than 52,000 Canadian organizations — including Sun Life, National Bank of Canada,
  Via Rail, Lightspeed, and Samsung — connecting employees and their families with
  multidisciplinary care teams of nurses, physicians, and mental health specialists.
  Dialogue is a consumer-facing digital health application; it does not currently publish
  a public developer API or OpenAPI surface.'
